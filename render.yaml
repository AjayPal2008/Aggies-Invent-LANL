# Render blueprint (free tier): New > Blueprint > pick this repo.
# Creates the web service and a free PostgreSQL database, wired together.
services:
  - type: web
    name: lanl-adaptive-training
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lanl-training-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
databases:
  - name: lanl-training-db
    plan: free
